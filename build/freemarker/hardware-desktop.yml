# settings
panelWidth: 219       # panel image width in pixels

networkDevices:
  - name: enp0s25
    type: ethernet
    maxUp: 3000       # speed in KiB
    maxDown: 73000
        
hardDisks:            # hard disks are also treated as temperature devices, see 'temperatures'
  - device: sda
    name: samsung SSD HD
    readSpeed: 200000
    writeSpeed: 280000
    hwmonIndex: 0             # optional | linux hardware monitor index, ex. hwmon3
    thresholdType: tempDisk   # optional | must be configured along side 'hwmonIndex'
    partitions:
      - name: fedora
        path: /
        icon: root
      - name: home
        path: /home
        icon: home
  - device: sdb
    name: seagate HD
    readSpeed:  250000
    writeSpeed: 250000
    hwmonIndex: 1
    thresholdType: tempDisk
    partitions:
      - name: veronica
        path: /media/veronica
        icon: partition
  - device: sdc
    name: seagate HD
    readSpeed:  250000
    writeSpeed: 250000
    hwmonIndex: 2
    thresholdType: tempDisk
    partitions:
      - name: betty
        path: /media/betty
        icon: partition
  - device: sdd
    readSpeed: 23552
    writeSpeed: 23552
    fileSuffix: maxtor  # optional | name to append to the output file name, ex. disk-maxtor
    required: false     # optional | hard disk can be ommitted by a 'non verbose' conky
    partitions:
      - name: maxtor
        path: /run/media/ernesto/MAXTOR
        icon: usbdrive

# hwmon properties for ${hwmon ...}
#
# hwmon dev               type  n
#       module                  number (if missing, defaults to 1)
#       hwmonIndex (disk)
temperatures:
  - name: cpu                 # description of the device       
    module: atk0110           # module name
    number: 1                 # number of the sensor
    thresholdType: tempCPU    # value must match a temperature key in the 'threshold' map
  - name: cpu core 1
    module: coretemp
    number: 2
    thresholdType: tempCPUCore
  - name: cpu core 2
    module: coretemp
    number: 3
    thresholdType: tempCPUCore
  - name: cpu core 3
    module: coretemp
    number: 4
    thresholdType: tempCPUCore
  - name: cpu core 4
    module: coretemp
    number: 5
    thresholdType: tempCPUCore
  - name: AMD Radeon HD7570
    module: radeon
    number: 1
    thresholdType: tempVideo

fans:
  - name: chasis front intake
    module: atk0110
    number: 3
  - name: cpu fan
    module: atk0110
    number: 1
  - name: chasis top exhaust
    module: atk0110
    number: 2
  - name: chasis back exhaust
    module: atk0110
    number: 4

# thresholds for the different conky meters
# when these limits are breached, values will change colors
#
# n.b. for values over 1000 you need to parse them individually in freemarker
#      with the '?c' built in or freemarker will parse it as 1,000 instead
threshold:
  # percentages
  cpu: 90
  mem: 90
  swap: 70
  filesystem: 90
  # temperatures in degrees celsius
  tempCPU: 90
  tempCPUCore: 93
  tempVideo: 75
  tempDisk: 42
  # revolutions per minute (rpm)
  fanSpeed: 2300
